<style>
/* ---------------- top contact bar (floats on the video) ---------------- */
.topbar {
  display: flex;
  gap: clamp(40px, 9vw, 130px);
  position: absolute;
  top: clamp(24px, 3vw, 40px);
  left: 0; right: 0;
  z-index: 6;
}

/* ---------------- hero ---------------- */
.hero { position: relative; }
.hero__media {
  position: relative;
  width: 100vw;
  left: 50%;
  transform: translateX(-50%);
  height: clamp(440px, 56.25vw, 810px);
  margin-top: 0;
  overflow: hidden;
  background:
    radial-gradient(120% 120% at 50% 0%, rgba(217,217,217,.62), rgba(217,217,217,.42) 55%, rgba(120,120,116,.35) 100%);
}
/* legibility scrim for the floating contact + name */
.hero__media::before {
  content: "";
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: linear-gradient(to bottom,
    rgba(0,0,0,.42) 0%, rgba(0,0,0,0) 20%,
    rgba(0,0,0,0) 62%, rgba(0,0,0,.46) 100%);
}
.hero__video {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0; transition: opacity .8s ease;
}
.hero__video.is-ready { opacity: 1; }
/* faint living sheen while no video is present */
.hero__media::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.10) 50%, transparent 70%);
  background-size: 280% 100%;
  animation: sheen 7s ease-in-out infinite;
  pointer-events: none;
}
.hero__placeholder {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  font-family: var(--mono); font-size: 13px; letter-spacing: .04em;
  color: rgba(40,40,38,.62); text-transform: uppercase;
  text-align: center; padding: 0 24px;
}
.hero__placeholder .ph-ico {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid rgba(40,40,38,.5);
  display: grid; place-items: center;
}
.hero__placeholder .ph-ico::before {
  content: ""; border-style: solid; border-width: 7px 0 7px 12px;
  border-color: transparent transparent transparent rgba(40,40,38,.7);
  margin-left: 3px;
}
@keyframes sheen { 0%,100% { background-position: 140% 0; } 50% { background-position: -40% 0; } }

.hero__name {
  margin: 0;
  font-size: 0;
  line-height: 0;
}
.hero__name img {
  display: block;
  width: 100%;
  height: auto;
}
/* the title floats on the video, its bottom (masked) edge resting on the
   sheet's top line so the “g” descenders are chopped off there */
.hero__namewrap {
  position: absolute;
  left: 0; right: 0;
  bottom: 0;
  z-index: 1;
}
/* the black “box” that carries everything beneath the hero; its top edge
   sits at the very bottom of the video and chops the title's descenders */
.sheet {
  position: relative;
  z-index: 2;
  background: var(--bg);
}
.sheet__line {
  border: 0;
  border-top: 1px solid var(--line);
  width: 100%;
  margin: 0;
}

/* ---------------- about ---------------- */
.about {
  display: grid;
  grid-template-columns: minmax(110px, 170px) minmax(0, 1fr);
  gap: clamp(24px, 6vw, 90px);
  padding-top: clamp(56px, 7vw, 96px);
}
.section-label {
  font-family: var(--grotesk); font-weight: 500;
  font-size: clamp(18px, 1.7vw, 24px); line-height: 1.1;
  color: var(--fg); margin: 0;
}
.about__bio { width: 542px; max-width: 100%; display: flex; flex-direction: column; gap: 1em; }
.about__bio p {
  margin: 0;
  font-family: "Noto Serif", var(--serif);
  font-weight: 600;
  font-size: 20px;
  letter-spacing: -1px;
  line-height: 1.42;
  color: var(--fg);
  text-wrap: pretty;
}

/* ---------------- news ---------------- */
.news { padding-top: clamp(64px, 8vw, 104px); }
.news__head { display: block; margin-bottom: clamp(28px, 3vw, 44px); }
.news__head .section-label { line-height: 1; }
.news__head .hrule { width: 100%; margin-top: 5px; }
.news__list { display: flex; flex-direction: column; gap: clamp(20px, 2vw, 30px); }
.news__row {
  display: grid;
  grid-template-columns: minmax(120px, 240px) minmax(0, 1fr);
  gap: clamp(20px, 6vw, 90px);
  align-items: baseline;
}
.news__date { font-weight: 500; font-size: clamp(15px, 1.25vw, 20px); letter-spacing: .04em; text-transform: uppercase; color: var(--fg); }
.news__txt  { font-weight: 500; font-size: clamp(15px, 1.25vw, 20px); line-height: 1.3; color: var(--fg); }

/* ---------------- what's on ---------------- */
.whats {
  text-align: center;
  font-family: var(--serif); font-weight: 400;
  font-size: clamp(64px, 14.4vw, 208px); line-height: .92;
  letter-spacing: -0.022em;
  margin: clamp(120px, 16vw, 220px) 0 clamp(48px, 6vw, 80px);
}

/* ---------------- work grid ---------------- */
.work {
  display: grid;
  grid-template-columns: 1.057fr 1fr;
  gap: clamp(20px, 2.1vw, 30px);
  padding-bottom: clamp(80px, 10vw, 150px);
}
.work__col { display: flex; flex-direction: column; gap: clamp(36px, 4.4vw, 64px); }
.work__col--right { gap: clamp(32px, 3.9vw, 56px); }

.card { display: block; }
.card__frame {
  position: relative;
  border-radius: 20px;
  overflow: hidden;
  background: transparent;
}
.card__frame img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform .7s cubic-bezier(.2,.7,.2,1), opacity .4s;
  will-change: transform;
}
.card--feature .card__frame { aspect-ratio: 560 / 565; }
.card--small .card__frame { aspect-ratio: 530 / 249; }
.card:hover .card__frame img { transform: scale(1.045); }

.card__meta {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 16px; margin-top: 16px; padding: 0 8px;
}
.card__cat { font-family: var(--mono); font-weight: 400; font-size: clamp(11px, .95vw, 15px); letter-spacing: .03em; text-transform: uppercase; color: var(--fg-dim); transition: color .25s; }
.card__title { display: inline-flex; align-items: center; font-weight: 500; font-size: clamp(14px, 1.1vw, 18px); color: var(--fg); white-space: nowrap; }
.card__title .arrow { display: inline-block; transition: transform .3s; opacity: 0; margin-left: 4px; }
.card:hover .card__cat { color: var(--fg); }
.card:hover .card__title .arrow { opacity: 1; transform: translateX(3px); }

/* ====================================================
   MOBILE — app-like reflow
   ==================================================== */
@media (max-width: 760px) {
  .topbar { gap: 36px; }
  .hero__media { border-radius: 0; }
  .hero__name { margin-top: -14px; }

  .about { grid-template-columns: 1fr; gap: 14px; }
  .about__bio { max-width: none; }

  .news__row { grid-template-columns: 88px 1fr; gap: 18px; }

  /* project grid → single full-width feed */
  .work { grid-template-columns: 1fr; gap: 28px; padding-bottom: 120px; }
  .work__col, .work__col--right { gap: 28px; }
  .card--feature .card__frame { aspect-ratio: 4 / 5; }
  .card--small .card__frame { aspect-ratio: 16 / 10; }
  .card__frame { border-radius: 16px; }
  .card__meta { padding: 0 2px; margin-top: 12px; }
  .card__title .arrow { opacity: 1; } /* always show affordance on touch */
}

@media (max-width: 420px) {
  .topbar { flex-direction: column; gap: 14px; }
}
</style>

<script>
  // Hero video: only request the file if it actually exists, so there's no
  // 404 while the slot is empty. The moment you add assets/hero.mp4 (any
  // common video name — edit the path below), it loads, plays and the
  // placeholder hides automatically. No other markup changes needed.
  (function () {
    var SRC = 'assets/hero.mp4';
    var v = document.querySelector('.hero__video');
    var ph = document.getElementById('heroPlaceholder');
    if (!v) return;
    fetch(SRC, { method: 'HEAD' }).then(function (res) {
      if (!res.ok) return;            // no file yet → keep tonal placeholder
      v.src = SRC;
      v.play().catch(function () {});
      v.addEventListener('loadeddata', function () {
        v.classList.add('is-ready');
        if (ph) ph.style.display = 'none';
      });
    }).catch(function () { /* offline / not found → keep placeholder */ });
  })();
</script>
